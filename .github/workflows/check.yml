name: Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - run: make check

  # The compiled frontend under internal/api/web/dist is committed so a plain
  # `go install` ships the full web UI. This job fails when it drifts from the
  # web/ sources — fix with `make embed-frontend` and commit the result.
  embed-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-frontend

      - run: make check-embed

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: make test-go

  test-e2e:
    runs-on: ubuntu-latest
    # The suite takes ~2 minutes; a hang in browser install or test startup
    # must fail fast, not sit until the 6-hour GitHub default.
    timeout-minutes: 15
    strategy:
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-frontend

      - run: make playwright-install PLAYWRIGHT_BROWSER=${{ matrix.browser }}

      - run: make test-e2e-browser PLAYWRIGHT_BROWSER=${{ matrix.browser }}
